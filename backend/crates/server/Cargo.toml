[package]
name = "icthub-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
encoding_rs = "0.8"
mime_guess = "2"
pdf-extract = "0.12"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
zip = { version = "4", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
